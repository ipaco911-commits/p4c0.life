<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P4C0.life</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .hero {
      padding: 80px 20px 40px;
    }

    h1 {
      font-size: 64px;
      margin: 0;
    }

    p {
      font-size: 20px;
      color: #bbb;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 30px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #1f1f1f;
      padding: 30px 20px;
      border-radius: 18px;
      font-size: 22px;
    }

    footer {
      padding: 40px;
      color: #777;
    }
  </style>
</head>
<body>

  <section class="hero">
    <h1>P4C0</h1>
    <p>My corner of the internet.</p>
  </section>

  <section class="cards">
    <div class="card">🍠 Food</div>
    <div class="card">🚶 Walking</div>
    <div class="card">🔧 Projects</div>
    <div class="card">💻 Tech</div>
    <div class="card">🐈 Life</div>
  </section>

  <footer>
    p4c0.life
  </footer>

</body>
</html>
